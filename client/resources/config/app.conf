# Client config (key=value)
output_dir=
gpu_enabled=true
log_level=info

# LLM gguf model path (optional; empty = rule-based highlight only)
llm_model_path=

# Vosk ASR model directory (optional; default models/vosk-model-small-cn-0.22)
# 须为含 am/final.mdl 的解压目录绝对路径；留空则自动探测。勿填 .
vosk_model_dir=

# 实时字幕（流式 ASR 两遍 + 字幕分路；与外挂 SRT 独立）
# provider: stub | funasr | aliyun | tencent
live_subtitle_provider=stub
# mode: two_pass | realtime_dynamic | delayed_steady
live_subtitle_mode=two_pass
live_subtitle_source_lang=zh
# 目标语言留空=不翻译（同传预留）
live_subtitle_target_lang=
# 游戏热词/口癖，逗号分隔
live_subtitle_hotwords=
# 字幕 WebSocket 分路（空=仅播放器叠加）
live_subtitle_ws_url=
# 云厂商占位
live_subtitle_cloud_endpoint=
live_subtitle_cloud_api_key=

# OpenCV frame filter: off | clahe | denoise | sharpen | film | neon | comic | pixel
opencv_filter=clahe
# Filter device: auto (prefer OpenCL) | cpu | opencl
opencv_filter_device=auto
# Apply filter while playing (true) or only on pause preview (false)
opencv_filter_playback=false

# PySceneDetect（游戏高光视觉切点）：adaptive | content
scenedetect_method=adaptive
# 跳帧加速（0=逐帧更准；2/3 更快略糙）
scenedetect_frame_skip=0

# Netease hot comments
netease_api_base=
netease_hot_comments_script=
netease_hot_comments_demo=true
