# Client config (key=value)
output_dir=
gpu_enabled=true
log_level=info

# LLM gguf model path (optional; empty = rule-based highlight only)
llm_model_path=

# Vosk ASR model directory (optional; default models/vosk-model-small-cn-0.22)
vosk_model_dir=

# OpenCV frame filter: off | clahe | denoise | sharpen | film | neon | comic | pixel
opencv_filter=clahe
# Apply filter while playing (true) or only on pause preview (false)
opencv_filter_playback=false

# Netease hot comments
netease_api_base=
netease_hot_comments_script=
netease_hot_comments_demo=true
